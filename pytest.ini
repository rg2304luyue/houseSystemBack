[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 控制台输出
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings

# 自定义标记
markers =
    slow: 标记耗时测试（需要外部服务或大数据量）
    integration: 需要数据库 / Redis 等基础设施
    unit: 纯逻辑测试，不依赖外部服务
    skip_ci: CI 环境下跳过

# 日志
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
