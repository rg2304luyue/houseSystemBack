services:
  redis:
    image: redis:7-alpine
    container_name: house_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mysql:
    image: mysql:8.0
    container_name: house_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flaskhousesystem}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      # MySQL executes this only when mysql_data is empty. The dump is already
      # stamped at the current Alembic head; existing volumes are never imported.
      - ./flaskhousesystem.sql:/docker-entrypoint-initdb.d/001-flaskhousesystem.sql:ro
    restart: always
    command: --default-time_zone=+08:00
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  migrate:
    build: .
    image: house-backend:latest
    container_name: house_migrate
    command: python -m alembic upgrade head
    environment: &backend_environment
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the environment or .env file}
      DEBUG: "false"
      PAYMENT_MOCK_ENABLED: "false"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DB: ${MYSQL_DATABASE:-flaskhousesystem}
      QQ_SMTP_EMAIL: ${QQ_SMTP_EMAIL:-}
      QQ_SMTP_AUTH_CODE: ${QQ_SMTP_AUTH_CODE:-}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  backend:
    build: .
    image: house-backend:latest
    container_name: house_backend
    ports:
      - "8000:8000"
    volumes:
      - ./exts/app_private_key.txt:/app/exts/app_private_key.txt:ro
      - ./exts/alipay_public_key.txt:/app/exts/alipay_public_key.txt:ro
    environment:
      <<: *backend_environment
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: ../houseSystemFront-Ylfmoonn
    container_name: house_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always

volumes:
  redis_data:
  mysql_data:
