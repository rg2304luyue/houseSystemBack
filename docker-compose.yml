# ============================================================
# 链居 - Docker Compose 一键编排
# 启动: docker compose up -d --build
# 停止: docker compose down
# ============================================================

services:
  # ---- Redis 缓存 + Celery 消息队列 ----
  redis:
    image: redis:7-alpine
    container_name: house_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ---- MySQL 数据库 ----
  mysql:
    image: mysql:8.0
    container_name: house_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flaskhousesystem}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
    command: --default-time_zone='+8:00'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---- 后端 Flask 服务 (Gunicorn) ----
  backend:
    build: .
    container_name: house_backend
    ports:
      - "5000:5000"
    volumes:
      - ./exts/app_private_key.txt:/app/exts/app_private_key.txt:ro
      - ./exts/alipay_public_key.txt:/app/exts/alipay_public_key.txt:ro
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DB: ${MYSQL_DATABASE:-flaskhousesystem}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      QQ_SMTP_EMAIL: ${QQ_SMTP_EMAIL}
      QQ_SMTP_AUTH_CODE: ${QQ_SMTP_AUTH_CODE}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # ---- Celery Worker（异步任务：邮件发送等）----
  celery:
    build: .
    container_name: house_celery
    command: celery -A app:celery worker --loglevel=info --concurrency=4
    volumes:
      - ./exts/app_private_key.txt:/app/exts/app_private_key.txt:ro
      - ./exts/alipay_public_key.txt:/app/exts/alipay_public_key.txt:ro
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DB: ${MYSQL_DATABASE:-flaskhousesystem}
      QQ_SMTP_EMAIL: ${QQ_SMTP_EMAIL}
      QQ_SMTP_AUTH_CODE: ${QQ_SMTP_AUTH_CODE}
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: always

  # ---- 前端 Nginx + Vue SPA ----
  frontend:
    build: ../houseSystemFront-Ylfmoonn
    container_name: house_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

# ---- 数据持久化 ----
volumes:
  redis_data:
  mysql_data:
